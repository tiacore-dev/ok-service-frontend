name: Deploy to Server

on:
  push:
    branches: [ master, stage, dev ]

# contents: write is granted only to the release job.
permissions:
  contents: read

env:
  PROD_DEPLOY_PATH: apps/ok-service-frontend

# master: one production sequence at a time (version -> build -> deploy -> release), never cancelled
# mid-way; a newer queued run supersedes an older queued one. dev/stage: unserialized, as before.
concurrency:
  group: ${{ github.ref_name == 'master' && 'ok-service-frontend-production' || format('deploy-{0}-{1}', github.ref_name, github.run_id) }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      # master only: outdated | none | released | resume | new (see docs/release-process.md)
      release_state: ${{ steps.plan.outputs.release_state }}
      version: ${{ steps.plan.outputs.version }}
      digest: ${{ steps.promote.outputs.digest || steps.plan.outputs.digest }}
    env:
      API_URL_PROD: ${{ secrets.API_URL_PROD }}
      API_URL_DEV: ${{ secrets.API_URL_DEV }}
      API_URL_STAGE: ${{ secrets.API_URL_STAGE }}
      API_URL_TEST: ${{ secrets.API_URL_TEST }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set API URLs from secrets
        id: set-urls
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "api_url=${API_URL_PROD}" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "api_url=${API_URL_DEV}" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            echo "api_url=${API_URL_STAGE}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${API_URL_TEST}" >> $GITHUB_OUTPUT
          fi

      - name: Echo selected API URL
        run: |
          api_url="${{ steps.set-urls.outputs.api_url }}"
          if [ -z "$api_url" ]; then
            echo "⚠️ API URL is empty"
          else
            safe_prefix="${api_url:0:24}"
            echo "📡 Using API URL (prefix): ${safe_prefix}..."
          fi

      - name: Select Firebase settings for DEV
        if: github.ref_name == 'dev'
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY_DEV }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN_DEV }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID_DEV }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET_DEV }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID_DEV }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID_DEV }}
          REACT_APP_FIREBASE_VAPID_KEY: ${{ secrets.REACT_APP_FIREBASE_VAPID_KEY_DEV }}
        run: |
          printf '%s=%s\n' REACT_APP_FIREBASE_API_KEY "$REACT_APP_FIREBASE_API_KEY" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_AUTH_DOMAIN "$REACT_APP_FIREBASE_AUTH_DOMAIN" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_PROJECT_ID "$REACT_APP_FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_STORAGE_BUCKET "$REACT_APP_FIREBASE_STORAGE_BUCKET" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_MESSAGING_SENDER_ID "$REACT_APP_FIREBASE_MESSAGING_SENDER_ID" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_APP_ID "$REACT_APP_FIREBASE_APP_ID" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_VAPID_KEY "$REACT_APP_FIREBASE_VAPID_KEY" >> "$GITHUB_ENV"

      - name: Select Firebase settings for STAGE
        if: github.ref_name == 'stage'
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY_STAGE }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN_STAGE }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID_STAGE }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET_STAGE }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID_STAGE }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID_STAGE }}
          REACT_APP_FIREBASE_VAPID_KEY: ${{ secrets.REACT_APP_FIREBASE_VAPID_KEY_STAGE }}
        run: |
          printf '%s=%s\n' REACT_APP_FIREBASE_API_KEY "$REACT_APP_FIREBASE_API_KEY" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_AUTH_DOMAIN "$REACT_APP_FIREBASE_AUTH_DOMAIN" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_PROJECT_ID "$REACT_APP_FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_STORAGE_BUCKET "$REACT_APP_FIREBASE_STORAGE_BUCKET" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_MESSAGING_SENDER_ID "$REACT_APP_FIREBASE_MESSAGING_SENDER_ID" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_APP_ID "$REACT_APP_FIREBASE_APP_ID" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_VAPID_KEY "$REACT_APP_FIREBASE_VAPID_KEY" >> "$GITHUB_ENV"

      - name: Select Firebase settings for PROD
        if: github.ref_name == 'master'
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY_PROD }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN_PROD }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID_PROD }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET_PROD }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID_PROD }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID_PROD }}
          REACT_APP_FIREBASE_VAPID_KEY: ${{ secrets.REACT_APP_FIREBASE_VAPID_KEY_PROD }}
        run: |
          printf '%s=%s\n' REACT_APP_FIREBASE_API_KEY "$REACT_APP_FIREBASE_API_KEY" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_AUTH_DOMAIN "$REACT_APP_FIREBASE_AUTH_DOMAIN" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_PROJECT_ID "$REACT_APP_FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_STORAGE_BUCKET "$REACT_APP_FIREBASE_STORAGE_BUCKET" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_MESSAGING_SENDER_ID "$REACT_APP_FIREBASE_MESSAGING_SENDER_ID" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_APP_ID "$REACT_APP_FIREBASE_APP_ID" >> "$GITHUB_ENV"
          printf '%s=%s\n' REACT_APP_FIREBASE_VAPID_KEY "$REACT_APP_FIREBASE_VAPID_KEY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select production version
        id: plan
        if: github.ref_name == 'master'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ok-service-frontend
        run: |
          set -euo pipefail
          sh scripts/release-version.sh plan "$IMAGE" | tee -a "$GITHUB_OUTPUT"

      # master builds a production-only candidate (prod-<sha>): the same SHA built for dev/stage
      # bundles other API/Firebase settings and must never be promoted.
      - name: Build and push image
        id: build
        if: github.ref_name != 'master' || steps.plan.outputs.release_state == 'new'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ok-service-frontend:${{ github.ref_name == 'master' && 'prod-' || '' }}${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.plan.outputs.version || github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ok-service-frontend:cache
          cache-to: type=inline
          build-args: |
            REACT_APP_API_URL=${{ steps.set-urls.outputs.api_url }}
            REACT_APP_WP=${{ secrets.APP_WP }}
            REACT_APP_FIREBASE_API_KEY=${{ env.REACT_APP_FIREBASE_API_KEY }}
            REACT_APP_FIREBASE_AUTH_DOMAIN=${{ env.REACT_APP_FIREBASE_AUTH_DOMAIN }}
            REACT_APP_FIREBASE_PROJECT_ID=${{ env.REACT_APP_FIREBASE_PROJECT_ID }}
            REACT_APP_FIREBASE_STORAGE_BUCKET=${{ env.REACT_APP_FIREBASE_STORAGE_BUCKET }}
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ env.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
            REACT_APP_FIREBASE_APP_ID=${{ env.REACT_APP_FIREBASE_APP_ID }}
            REACT_APP_FIREBASE_VAPID_KEY=${{ env.REACT_APP_FIREBASE_VAPID_KEY }}

      - name: Promote production candidate to X.Y.Z
        id: promote
        if: steps.plan.outputs.release_state == 'new'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ok-service-frontend
          VERSION: ${{ steps.plan.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          : "${DIGEST:?build did not report a digest}"
          sh scripts/release-version.sh promote "$IMAGE" "$VERSION" "$DIGEST" | tee -a "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # master deploys only a new or resumed release; dev/stage always deploy, as before.
    if: github.ref_name != 'master' || needs.build-and-push.outputs.release_state == 'new' || needs.build-and-push.outputs.release_state == 'resume'
    outputs:
      outcome: ${{ steps.prod.outputs.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==== ВЫБОР SSH-КЛЮЧА/ЮЗЕРА/IP ПО ВЕТКЕ ====
      - name: Setup SSH for Master
        if: github.ref_name == 'master'
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_MASTER }}

      - name: Set Master host vars
        if: github.ref_name == 'master'
        run: |
          echo "SSH_USER=${{ secrets.SSH_USER_MASTER }}" >> $GITHUB_ENV
          echo "SERVER_IP=${{ secrets.SERVER_IP_MASTER }}" >> $GITHUB_ENV

      - name: Setup SSH for Dev
        if: github.ref_name == 'dev'
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}

      - name: Set Dev host vars
        if: github.ref_name == 'dev'
        run: |
          echo "SSH_USER=${{ secrets.SSH_USER_DEV }}" >> $GITHUB_ENV
          echo "SERVER_IP=${{ secrets.SERVER_IP_DEV }}" >> $GITHUB_ENV

      - name: Setup SSH for Stage
        if: github.ref_name == 'stage'
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_STAGE }}

      - name: Set Stage host vars
        if: github.ref_name == 'stage'
        run: |
          echo "SSH_USER=${{ secrets.SSH_USER_STAGE }}" >> $GITHUB_ENV
          echo "SERVER_IP=${{ secrets.SERVER_IP_STAGE }}" >> $GITHUB_ENV
      # ============================================

      # The production pre-check reads the registry.
      - name: Login to DockerHub
        if: github.ref_name == 'master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Deployment Path and Tag
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "DEPLOY_PATH=${PROD_DEPLOY_PATH}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "DEPLOY_PATH=/opt/apps/ok-service-frontend-dev" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "stage" ]]; then
            echo "DEPLOY_PATH=/opt/apps/ok-service-frontend-stage" >> $GITHUB_ENV
          else
            echo "❌ Неизвестная ветка! Прерываем процесс."
            exit 1
          fi
          echo "DEPLOY_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "DEPLOY_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Deploy Frontend (production)
        id: prod
        if: github.ref_name == 'master'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ok-service-frontend
          VERSION: ${{ needs.build-and-push.outputs.version }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${VERSION:?}" "${DIGEST:?}"
          # Recheck right before touching production: this commit must still own the promoted release
          # (also when master has moved on) and nothing newer may be released.
          PLAN="$(sh scripts/release-version.sh plan "$IMAGE")"
          [ "$PLAN" = "$(printf 'release_state=resume\nversion=%s\ndigest=%s' "$VERSION" "$DIGEST")" ] \
            || { printf 'Refusing to deploy %s@%s; current plan:\n%s\n' "$VERSION" "$DIGEST" "$PLAN"; exit 1; }

          echo "🚀 Deploying ${IMAGE}:${VERSION}@${DIGEST} (${GITHUB_SHA}) to ${SERVER_IP}:${DEPLOY_PATH}"
          # Credentials travel on stdin with the script, not on the remote command line.
          { printf 'export DOCKERHUB_USERNAME=%q DOCKERHUB_TOKEN=%q\n' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN"
            cat scripts/deploy-production.sh; } \
            | ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 "${SSH_USER}@${SERVER_IP}" \
              bash -s -- deploy "$DEPLOY_PATH" "$IMAGE" "$VERSION" "$DIGEST" "$GITHUB_SHA"
          echo "outcome=verified" >> "$GITHUB_OUTPUT"

      - name: Deploy Frontend
        if: github.ref_name != 'master'
        env:
          SSH_USER: ${{ env.SSH_USER }}
          SERVER_IP: ${{ env.SERVER_IP }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_TAG: ${{ env.DEPLOY_TAG }}
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
        run: |
          echo "🚀 Деплой на ${SSH_USER}@${SERVER_IP} в ${DEPLOY_PATH} (branch: ${DEPLOY_BRANCH}) ..."
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 "${SSH_USER}@${SERVER_IP}" << 'EOF'
            set -euo pipefail

            export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
            export DOCKERHUB_TOKEN='${{ secrets.DOCKERHUB_TOKEN }}'
            export DEPLOY_TAG='${{ env.DEPLOY_TAG }}'
            export DEPLOY_BRANCH='${{ env.DEPLOY_BRANCH }}'
            export DEPLOY_PATH='${{ env.DEPLOY_PATH }}'

            # Проверим наличие docker compose v2
            if ! docker compose version >/dev/null 2>&1; then
              echo "❌ Docker Compose v2 не найден. Установите docker-compose-plugin."
              exit 1
            fi

            cd "$DEPLOY_PATH" || { echo "❌ Не удалось перейти в $DEPLOY_PATH"; exit 1; }

            echo "➡️ git pull origin ${DEPLOY_BRANCH}"
            git fetch origin "${DEPLOY_BRANCH}"
            git checkout "${DEPLOY_BRANCH}" || true
            git pull --rebase origin "${DEPLOY_BRANCH}" || { echo "❌ git pull не удался"; exit 1; }

            echo "➡️ docker login"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin \
              || { echo "❌ Docker login failed"; exit 1; }

            # Обновляем .env с новым тегом (и при необходимости юзернейм)
            touch .env
            if grep -q "^TAG=" .env; then
              sed -i "s/^TAG=.*/TAG=$DEPLOY_TAG/" .env
            else
              echo "TAG=$DEPLOY_TAG" >> .env
            fi
            grep -q "^DOCKERHUB_USERNAME=" .env || echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" >> .env

            echo "➡️ docker compose down (мягко)"
            docker compose down || true

            echo "➡️ docker compose pull"
            docker compose pull --ignore-pull-failures || true

            echo "➡️ docker compose up -d"
            docker compose up -d --remove-orphans \
              || { echo "❌ docker compose up failed"; exit 1; }

            echo "✅ Деплой завершён"
          EOF

  release:
    name: 🏷️ Release
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    # Only after this run verified the deployment, or to finish publication of an already tagged release.
    if: >-
      always() && github.ref_name == 'master' && needs.build-and-push.result == 'success' &&
      (needs.build-and-push.outputs.release_state == 'released' ||
       (needs.deploy.result == 'success' && needs.deploy.outputs.outcome == 'verified'))
    permissions:
      contents: write
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ok-service-frontend
      VERSION: ${{ needs.build-and-push.outputs.version }}
      DIGEST: ${{ needs.build-and-push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same identity checks as deploy: candidate, version digest, labels, annotated tag on this commit.
      - name: Check release identity
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${VERSION:?}" "${DIGEST:?}"
          PLAN="$(sh scripts/release-version.sh plan "$IMAGE")"
          case "$PLAN" in
            "$(printf 'release_state=resume\nversion=%s\ndigest=%s' "$VERSION" "$DIGEST")" | \
            "$(printf 'release_state=released\nversion=%s\ndigest=%s' "$VERSION" "$DIGEST")") ;;
            *) printf 'Refusing to publish %s@%s; current plan:\n%s\n' "$VERSION" "$DIGEST" "$PLAN"; exit 1 ;;
          esac
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}")"
          case "$CODE" in
            200) echo "GitHub Release v${VERSION} already exists: nothing to publish, nothing redeployed."
                 echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Cannot read releases (HTTP ${CODE})"; exit 1 ;;
          esac

      - name: Setup SSH for Master
        if: steps.check.outputs.published == 'false'
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_MASTER }}

      # Publication needs the live, healthy container of exactly this digest, also when only the
      # Release is missing; it never redeploys.
      - name: Verify live deployment
        if: steps.check.outputs.published == 'false'
        env:
          SSH_USER: ${{ secrets.SSH_USER_MASTER }}
          SERVER_IP: ${{ secrets.SERVER_IP_MASTER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 "${SSH_USER}@${SERVER_IP}" \
            bash -s -- verify "$PROD_DEPLOY_PATH" "$IMAGE" "$VERSION" "$DIGEST" < scripts/deploy-production.sh

      - name: Create tag and GitHub Release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # An existing tag was verified above (annotated, on this commit); it is never moved.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists on this commit"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" "$GITHUB_SHA" -m "ok-service-frontend ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

          { sh scripts/release-version.sh notes "$VERSION"
            printf '\n- Commit: `%s`\n- Image: `%s:%s`\n- Digest: `%s`\n- Actions run: %s\n' \
              "$GITHUB_SHA" "$IMAGE" "$VERSION" "$DIGEST" "$RUN_URL"; } > release_notes.md
          cat release_notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release_notes.md

  notify:
    name: 📬 Notifications
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy, release]
    if: always()

    steps:
      - name: Checkout (for commit message fallback)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install jq (if missing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y jq >/dev/null
          fi

      - name: 📬 Telegram + Jira/OpenProject comments
        continue-on-error: true
        env:
          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}

          # Jira
          JIRA_URL: ${{ secrets.JIRA_URL }}                 # https://your-domain.atlassian.net
          JIRA_USER: ${{ secrets.JIRA_USER }}               # обычно email
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          # OpenProject
          OPENPROJECT_URL: ${{ secrets.OPENPROJECT_URL }}
          OPENPROJECT_API_TOKEN: ${{ secrets.OPENPROJECT_API_TOKEN }}

          # optional: имя сервиса
          SERVICE_NAME: ok-frontend

        run: |
          set -euo pipefail

          REF_NAME="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
          REPO_URL="https://github.com/${REPO}"

          BUILD_STATUS="${{ needs['build-and-push'].result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          RELEASE_STATUS="${{ needs.release.result }}"
          RELEASE_STATE="${{ needs['build-and-push'].outputs.release_state }}"
          VERSION="${{ needs['build-and-push'].outputs.version }}"
          DIGEST="${{ needs['build-and-push'].outputs.digest }}"

          # Итог: success (dev/stage) | released | unpublished | skipped | failed
          SKIP_REASON=""
          if [ "${BUILD_STATUS}" != "success" ]; then
            RESULT="failed"
          elif [ "${REF_NAME}" != "master" ]; then
            if [ "${DEPLOY_STATUS}" = "success" ]; then RESULT="success"; else RESULT="failed"; fi
          else
            case "${RELEASE_STATE}" in
              outdated) RESULT="skipped"; SKIP_REASON="в master уже более новый коммит — релиз выпустит его запуск" ;;
              none)     RESULT="skipped"; SKIP_REASON="нет коммитов feat/fix/perf/breaking после последнего релиза" ;;
              released)
                if [ "${RELEASE_STATUS}" = "success" ]; then
                  RESULT="skipped"; SKIP_REASON="v${VERSION} уже выпущена из этого коммита"
                else
                  RESULT="unpublished"
                fi ;;
              *)
                if [ "${DEPLOY_STATUS}" != "success" ]; then RESULT="failed"
                elif [ "${RELEASE_STATUS}" = "success" ]; then RESULT="released"
                else RESULT="unpublished"
                fi ;;
            esac
          fi

          # commit message / author (фолбэк, чтобы не зависеть от head_commit.*)
          COMMIT_MESSAGE="$(git log -1 --pretty=%B || true)"
          AUTHOR_NAME="$(git log -1 --pretty=%an || true)"
          AUTHOR_LOGIN="${{ github.actor }}"

          # окружение по ветке
          case "${REF_NAME}" in
            dev)    ENV_NAME="dev" ;;
            stage)  ENV_NAME="stage" ;;
            master) ENV_NAME="prod" ;;
            *)      ENV_NAME="${REF_NAME}" ;;
          esac

          # HTML escape для Telegram
          html_escape() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          SAFE_MSG="$(html_escape "${COMMIT_MESSAGE}")"
          SAFE_AUTHOR="$(html_escape "${AUTHOR_NAME:-$AUTHOR_LOGIN}")"

          # extract Jira keys + OP ids
          extract_jira_keys() {
            printf '%s\n' "${COMMIT_MESSAGE}" \
              | grep -oiE '\b[A-Z][A-Z0-9]+-[0-9]+\b' \
              | tr '[:lower:]' '[:upper:]' \
              | sort -u
          }

          extract_op_ids() {
            printf '%s\n' "${COMMIT_MESSAGE}" \
              | grep -oE 'OP#[0-9]+' \
              | sed 's/OP#//g' \
              | sort -u
          }

          JIRA_KEYS="$(extract_jira_keys || true)"
          OP_IDS="$(extract_op_ids || true)"

          # --- Telegram header
          case "${RESULT}" in
            success)     HEAD="✅ <b>Frontend deploy успешен</b>" ;;
            released)    HEAD="🚀 <b>Frontend v${VERSION} выпущен в production</b>" ;;
            unpublished) HEAD="⚠️ <b>Frontend v${VERSION} развёрнут в production, но релиз не опубликован</b> (release=${RELEASE_STATUS})" ;;
            skipped)     HEAD="⏭️ <b>Деплой frontend не требуется:</b> ${SKIP_REASON}" ;;
            *)           HEAD="🛑 <b>Ошибка фронтового деплоя</b> (build=${BUILD_STATUS}, deploy=${DEPLOY_STATUS})" ;;
          esac

          RELEASE_LINE=""
          if [ -n "${VERSION}" ]; then
            RELEASE_LINE="🏷️ <b>Версия:</b> <code>v${VERSION}</code> <code>${DIGEST:-—}</code>"
          fi

          case "${RESULT}" in
            success)     COMMENT="Frontend deployed to ${ENV_NAME} via GitHub Actions run ${RUN_URL}" ;;
            released)    COMMENT="Frontend v${VERSION} released to ${ENV_NAME} (image ${DIGEST}) via GitHub Actions run ${RUN_URL}" ;;
            unpublished) COMMENT="Frontend v${VERSION} deployed to ${ENV_NAME}, but GitHub Release publication failed: ${RUN_URL}" ;;
            skipped)     COMMENT="" ;;  # nothing changed, no task comments
            *)           COMMENT="Frontend deployment to ${ENV_NAME} failed: ${RUN_URL}" ;;
          esac

          TASKS_BLOCK=""
          if [ -n "${JIRA_KEYS:-}" ] || [ -n "${OP_IDS:-}" ]; then
            TASKS_BLOCK="📌 <b>Задачи:</b>"

            if [ -n "${JIRA_KEYS:-}" ]; then
              TASKS_BLOCK="${TASKS_BLOCK}
              <b>Jira:</b>"
              for KEY in ${JIRA_KEYS}; do
                if [ -n "${JIRA_URL:-}" ]; then
                  URL="${JIRA_URL%/}/browse/${KEY}"
                  TASKS_BLOCK="${TASKS_BLOCK}
                  • <a href=\"${URL}\">${KEY}</a>"
                else
                  TASKS_BLOCK="${TASKS_BLOCK}
                  • ${KEY}"
                fi
              done
            fi

            if [ -n "${OP_IDS:-}" ]; then
              TASKS_BLOCK="${TASKS_BLOCK}
              <b>OpenProject:</b>"
              for ID in ${OP_IDS}; do
                if [ -n "${OPENPROJECT_URL:-}" ]; then
                  URL="${OPENPROJECT_URL%/}/work_packages/${ID}"
                  TASKS_BLOCK="${TASKS_BLOCK}
                  • <a href=\"${URL}\">OP#${ID}</a>"
                else
                  TASKS_BLOCK="${TASKS_BLOCK}
                  • OP#${ID}"
                fi
              done
            fi
          else
            TASKS_BLOCK="📌 <b>Задачи:</b> нет (не найдено ни OP#123, ни ABC-123)"
          fi

          EXTRA_LINK=""
          if [ "${RESULT}" != "success" ] && [ "${RESULT}" != "released" ]; then
            EXTRA_LINK="<a href=\"${RUN_URL}\">🔍 Открыть GitHub Actions</a>"
          fi

          TEXT="$(cat <<EOF
          ${HEAD}

          🧩 <b>Сервис:</b> <code>${SERVICE_NAME}</code>
          🧩 <b>Env:</b> <code>${ENV_NAME}</code>
          📦 <b>Ветка:</b> <code>${REF_NAME}</code>
          🔖 <b>Коммит:</b> <code>${SHORT_SHA}</code>
          ${RELEASE_LINE}
          👤 <b>Автор:</b> <a href="https://github.com/${AUTHOR_LOGIN}">${SAFE_AUTHOR}</a>

          📝 <b>Сообщение:</b>
          <code>${SAFE_MSG}</code>

          ${TASKS_BLOCK}

          <a href="${RUN_URL}">🔗 Открыть GitHub Actions</a>
          <a href="${REPO_URL}">📦 Репозиторий</a>
          ${EXTRA_LINK}
          EOF
          )"

          # --- 1) Telegram send
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              ${TELEGRAM_THREAD_ID:+-d message_thread_id="${TELEGRAM_THREAD_ID}"} \
              -d parse_mode=HTML \
              -d disable_web_page_preview=true \
              --data-urlencode "text=${TEXT}" >/dev/null || true
          else
            echo "Telegram creds missing, skip"
          fi

          # --- 2) Jira comments
          if [ -n "${COMMENT}" ] && [ -n "${JIRA_URL:-}" ] && [ -n "${JIRA_USER:-}" ] && [ -n "${JIRA_API_TOKEN:-}" ] && [ -n "${JIRA_KEYS:-}" ]; then
            PAYLOAD="$(jq -n --arg body "$COMMENT" '{body:$body}')"

            for KEY in ${JIRA_KEYS}; do
              echo "Post comment to Jira ${KEY}"

              code="$(curl -s -o /tmp/jira_out -w "%{http_code}" \
                -u "${JIRA_USER}:${JIRA_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -X POST "${JIRA_URL%/}/rest/api/3/issue/${KEY}/comment" \
                -d "${PAYLOAD}" || true)"

              if [ "$code" = "404" ] || [ "$code" = "400" ]; then
                code2="$(curl -s -o /tmp/jira_out2 -w "%{http_code}" \
                  -u "${JIRA_USER}:${JIRA_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -X POST "${JIRA_URL%/}/rest/api/2/issue/${KEY}/comment" \
                  -d "${PAYLOAD}" || true)"
                [ "$code2" -ge 200 ] && [ "$code2" -lt 300 ] || echo "Jira comment failed for ${KEY} (http ${code2})"
              else
                [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || echo "Jira comment failed for ${KEY} (http ${code})"
              fi
            done
          else
            echo "Skipped deploy, or Jira creds/keys missing: no Jira comments"
          fi

          # --- 3) OpenProject comments
          if [ -n "${COMMENT}" ] && [ -n "${OPENPROJECT_URL:-}" ] && [ -n "${OPENPROJECT_API_TOKEN:-}" ] && [ -n "${OP_IDS:-}" ]; then
            for ID in ${OP_IDS}; do
              echo "Post comment to OpenProject OP#${ID}"
              curl -sS -X POST \
                -u "apikey:${OPENPROJECT_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "${OPENPROJECT_URL%/}/api/v3/work_packages/${ID}/activities" \
                -d "$(jq -n --arg c "$COMMENT" '{comment:{raw:$c}}')" \
                >/dev/null || echo "OpenProject comment failed for OP#${ID}"
            done
          else
            echo "Skipped deploy, or OpenProject creds/ids missing: no OpenProject comments"
          fi
