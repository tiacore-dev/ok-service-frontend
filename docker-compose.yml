services:
  frontend:
    container_name: ok-service-frontend-${CONFIG_NAME}
    # Same Docker Hub repository CI pushes to; the default keeps older .env files working.
    image: ${DOCKERHUB_USERNAME:-gloomylime}/ok-service-frontend:${TAG}
    ports:
      - "127.0.0.1:${PORT}:3000"
    restart: always
    networks:
      - ok_network


networks:
  ok_network:
    external: true
